name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/yutongzhu.com
            GIT_SSH_COMMAND='ssh -i ~/.ssh/id_ed25519_yutongzhu -o StrictHostKeyChecking=no' git pull origin main
            npm install --silent
            npm run build
            systemctl restart yutongzhu
            echo "Deploy OK"
