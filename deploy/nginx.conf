# Deploy copies this to /etc/nginx/sites-available/yutongzhu.site
# Do not install into conf.d — yutongzhu.com stays a redirect to this host.

server {
    server_name yutongzhu.site www.yutongzhu.site 39.106.85.231;

    root /opt/yutongzhu.com/public;
    index index.html;
    client_max_body_size 50m;

    # 首页、文章页和样式都很小，但每个新访客都会再要一次。压缩 HTML/CSS，
    # 图片和样式给一个可复用的缓存时间，重复访问不再把字节打回这台机器。
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/css text/plain application/rss+xml image/svg+xml;

    include snippets/clippin-jimmy-proxy.conf;

    location = /about {
        return 301 /about/;
    }

    location = /admin/ {
        return 301 /admin;
    }

    location /admin {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header WWW-Authenticate;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~ ^/posts/(?<slug>[^/]+)/media/(?<file>[^/]+)$ {
        root /opt/yutongzhu.com;
        try_files /public/posts/$slug/media/$file /src/posts/$slug/media/$file =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~ ^/posts/[^/]+$ {
        return 301 $uri/;
    }

    location /rss.xml {
        default_type application/rss+xml;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    location = /style.css {
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
        expires 1m;
        add_header Cache-Control "public";
    }

    listen [::]:443 ssl http2;
    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/yutongzhu.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yutongzhu.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name yutongzhu.site www.yutongzhu.site 39.106.85.231;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    include snippets/clippin-jimmy-proxy.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}
